
services:
  db:
    image: postgres:16
    container_name: wallet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: wallet_user
      POSTGRES_PASSWORD: wallet_dev_password
    ports:
      - "5432:5432"
    volumes:
      - wallet_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_user -d wallet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: wallet_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://wallet_user:wallet_dev_password@db:5432/wallet_db
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set ADMIN_API_TOKEN in your .env file}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    container_name: wallet_worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://wallet_user:wallet_dev_password@db:5432/wallet_db
      RECONCILIATION_INTERVAL_SECONDS: "86400"
    depends_on:
      db:
        condition: service_healthy

volumes:
  wallet_data:
